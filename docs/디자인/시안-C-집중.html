<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NFS 시안 C — 집중 (모바일)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════
   z=5 · 집중
   여기엔 크롬이 없다. 화면에 오브젝트가 하나뿐이다.
   ══════════════════════════════════════════════ */
:root{
  --bg:#050507;
  --hair:rgba(255,255,255,.09);
  --tx:#F6F6F8;
  --tx2:rgba(246,246,248,.56);
  --tx3:rgba(246,246,248,.30);
  --c:#7C8CFF;                       /* 이 블록의 카테고리 = 개발 */
  --ease:cubic-bezier(.32,.72,0,1);
  --f:'Instrument Sans','Noto Sans KR',-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#101014;font-family:var(--f);color:var(--tx);
  -webkit-font-smoothing:antialiased;display:grid;place-items:center;min-height:100vh}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

.device{position:relative;width:390px;height:844px;border-radius:54px;overflow:hidden;
  background:var(--bg);
  box-shadow:0 0 0 11px #17171B,0 0 0 12.5px #34343B,0 50px 110px rgba(0,0,0,.75)}
@media (min-width:521px) and (max-height:920px){.device{transform:scale(.9)}}
@media (min-width:521px) and (max-height:840px){.device{transform:scale(.8)}}
@media (max-width:520px){
  body{display:block}
  .device{width:100%;height:100dvh;border-radius:0;box-shadow:none}
}

/* 앰비언트 — 카테고리 색이 다이얼 뒤에서 빛난다 */
.bloom{position:absolute;left:-45%;right:-45%;top:14%;height:64%;pointer-events:none;
  background:radial-gradient(42% 42% at 50% 50%,color-mix(in srgb,var(--c) 34%,transparent),transparent 70%);
  filter:blur(46px)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(120% 90% at 50% 42%,transparent 42%,rgba(0,0,0,.72) 100%)}

.status{position:absolute;z-index:6;left:0;right:0;top:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:15px 30px 0;font-size:14px;font-weight:600;letter-spacing:-.01em;opacity:.5}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:104px;height:30px;border-radius:16px;background:#000;z-index:7}

/* ── 상단 : 최소한의 흔적만 ─────────────────── */
.top{position:absolute;z-index:5;left:0;right:0;top:62px;
  display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.close{width:38px;height:38px;border-radius:99px;background:rgba(255,255,255,.06);
  border:1px solid var(--hair);display:grid;place-items:center;color:var(--tx2);
  text-decoration:none;backdrop-filter:blur(20px)}
.left-cap{font-size:12px;color:var(--tx3);letter-spacing:-.01em}
.left-cap b{color:var(--tx2);font-weight:600}

/* ── 무대 ─────────────────────────────────── */
.stage{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:52px 24px 178px;text-align:center}

.tag{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 13px;border-radius:99px;
  background:color-mix(in srgb,var(--c) 16%,transparent);
  border:1px solid color-mix(in srgb,var(--c) 34%,transparent);
  font-size:12.5px;font-weight:600;letter-spacing:-.015em;color:var(--tx)}
.tag i{width:7px;height:7px;border-radius:99px;background:var(--c);box-shadow:0 0 10px var(--c)}
.title{margin:16px 0 0;font-size:22px;font-weight:600;letter-spacing:-.035em}
.meta{margin:6px 0 0;font-size:12.5px;color:var(--tx3);letter-spacing:-.01em}

/* 다이얼 */
.dial{position:relative;width:284px;height:284px;margin-top:30px}
.dial svg{position:absolute;inset:0;width:100%;height:100%}
.dial-face{position:absolute;inset:0;display:grid;place-content:center}
.timer{margin:0;font-size:76px;font-weight:500;letter-spacing:-.055em;line-height:1}
.timer-cap{margin:9px 0 0;font-size:11.5px;font-weight:500;color:var(--tx3);letter-spacing:.02em}

/* 뽀모도로 사이클 */
.cycles{display:flex;align-items:center;gap:7px;margin-top:26px}
.cycles i{width:34px;height:4px;border-radius:99px;background:rgba(255,255,255,.13)}
.cycles i.on{background:var(--c);box-shadow:0 0 12px var(--c)}
.cycles span{margin-left:6px;font-size:11.5px;color:var(--tx3);letter-spacing:-.01em}

/* ── 컨트롤 ───────────────────────────────── */
.controls{position:absolute;z-index:6;left:24px;right:24px;bottom:118px;
  display:flex;gap:11px}
.btn{flex:1;height:56px;border:0;border-radius:99px;font-family:var(--f);
  font-size:15.5px;font-weight:600;letter-spacing:-.025em;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px}
.btn-2{background:rgba(255,255,255,.07);border:1px solid var(--hair);color:var(--tx);
  backdrop-filter:blur(24px)}
.btn-1{background:var(--tx);color:#0A0A0D;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.btn:active{transform:scale(.975)}

/* ── 완료 후 안내 ─────────────────────────── */
.after{position:absolute;z-index:6;left:24px;right:24px;bottom:56px;
  display:flex;align-items:center;justify-content:center;gap:9px;
  font-size:11.5px;color:var(--tx3);letter-spacing:-.01em}
.after i{width:15px;height:15px;border-radius:4px;border:1px solid rgba(255,255,255,.22);
  display:grid;place-content:center;flex:none}
.after i svg{display:block}
.after b{color:var(--tx2);font-weight:500}

@media (prefers-reduced-motion:no-preference){
  .tag,.title,.meta,.dial,.cycles,.controls,.after{animation:up .7s var(--ease) both}
  .title{animation-delay:.05s}.meta{animation-delay:.08s}.dial{animation-delay:.12s}
  .cycles{animation-delay:.2s}.controls{animation-delay:.26s}.after{animation-delay:.3s}
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .arc{animation:sweep 1.4s var(--ease) both .25s}
  @keyframes sweep{from{stroke-dashoffset:659.7}}
  .halo{animation:breathe 6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.42;transform:scale(1)}50%{opacity:.85;transform:scale(1.035)}}
  .bloom{animation:glow 6s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.85}50%{opacity:1.0}}
}
</style>
</head>
<body>
<div class="device">
  <div class="bloom"></div>
  <div class="grain"></div>
  <div class="island"></div>

  <div class="status">
    <span class="num">14:07</span>
    <span style="display:flex;gap:6px;align-items:center">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" width="3" height="11" rx="1"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 10.5 5.6 8a3.4 3.4 0 0 1 4.8 0L8 10.5Zm-4.1-4.3a7.7 7.7 0 0 1 8.2 0l1.4-1.5a9.8 9.8 0 0 0-11 0l1.4 1.5ZM8 .8c-3 0-5.7 1-7.8 2.8l1.4 1.4A9.6 9.6 0 0 1 8 2.8c2.4 0 4.6.8 6.4 2.2l1.4-1.4A12 12 0 0 0 8 .8Z"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.2" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2 2 0 0 0 0-4Z" fill="currentColor" opacity=".4"/></svg>
    </span>
  </div>

  <div class="top">
    <span class="left-cap">오늘 남은 시간 <b class="num">13시간 30분</b></span>
    <a class="close" href="시안-B-하루.html" aria-label="닫고 오늘로">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2.5 5.5 7.5 10l5-4.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>

  <main class="stage">
    <span class="tag"><i></i>개발</span>
    <h1 class="title">설계 문서 정리</h1>
    <p class="meta num">14:00 – 15:00 · 60분 블록</p>

    <div class="dial">
      <svg viewBox="0 0 240 240" aria-label="25분 중 7분 지남, 18분 남음">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#A8B2FF"/>
            <stop offset="1" stop-color="#5B6DF0"/>
          </linearGradient>
          <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="7"/>
          </filter>
        </defs>
        <circle class="halo" cx="120" cy="120" r="105" fill="none"
                stroke="var(--c)" stroke-width="2" opacity=".5" filter="url(#soft)"/>
        <g transform="rotate(-90 120 120)" fill="none">
          <circle cx="120" cy="120" r="105" stroke="rgba(255,255,255,.07)" stroke-width="7"/>
          <circle class="arc" cx="120" cy="120" r="105" stroke="url(#g)" stroke-width="7"
                  stroke-linecap="round" stroke-dasharray="659.7" stroke-dashoffset="474.9"/>
        </g>
      </svg>
      <div class="dial-face">
        <p class="timer num">18:00</p>
        <p class="timer-cap">남은 집중 시간</p>
      </div>
    </div>

    <div class="cycles">
      <i class="on"></i><i></i>
      <span>뽀모도로 1 / 2</span>
    </div>
  </main>

  <div class="controls">
    <button class="btn btn-2" type="button">
      <svg width="14" height="15" viewBox="0 0 14 15" fill="currentColor"><rect x="1" y="1" width="4.4" height="13" rx="1.7"/><rect x="8.6" y="1" width="4.4" height="13" rx="1.7"/></svg>
      일시 정지
    </button>
    <button class="btn btn-1" type="button">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2 8.2 5.8 12 13 3.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      완료
    </button>
  </div>

  <label class="after">
    <i><svg width="9" height="8" viewBox="0 0 9 8" fill="none"><path d="M1 4.2 3.3 6.5 8 1.3" stroke="rgba(246,246,248,.5)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
    완료하면 <b>개발</b> 태그로 기록하고, 구글 캘린더에도 남깁니다
  </label>
</div>
</body>
</html>

# 자정 정산 배치 (O-07 · B-08)
#
# ⚠️ GitHub Actions 크론은 **UTC 로 돈다.** 러너의 TZ 를 바꿔도 크론 표현식에는 영향이 없다.
#    그래서 표현식 옆에 KST 환산을 반드시 병기한다.
#
#      자정 정산   KST 매일 00:05    →  '5 15 * * *'
#      주간 마감   KST 월요일 04:00  →  '0 19 * * 0'   ← UTC 로는 일요일! 요일까지 밀린다 (B-09)
#
# ⚠️ 크론 트리거는 정시를 보장하지 않는다. 러너가 붐비면 수십 분 밀린다.
#    그래서 라우트는 "어제 날짜"가 아니라 "오늘보다 이전 work_date 전부"를 처리한다.
#    한 번 걸러도 다음 실행이 밀린 날까지 걷어간다.

name: daily-settlement

on:
  schedule:
    - cron: '5 15 * * *' # UTC 15:05 = KST 00:05
  workflow_dispatch: # 크론을 하루 기다리지 않고 손으로 돌려본다

# 앞 실행이 아직 돌고 있으면 겹쳐 돌리지 않는다.
# 배치는 멱등하므로 겹쳐도 원장은 안전하지만, 커넥션을 두 배로 잡을 이유가 없다.
concurrency:
  group: daily-settlement
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 자정 정산 호출
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "APP_URL 또는 CRON_SECRET 시크릿이 설정되지 않았습니다"
            exit 1
          fi

          # hasMore 가 true 면 남은 대상이 있다는 뜻이다 (API명세 §6).
          # 함수 실행시간 상한 때문에 한 번에 다 못 도는 경우다. 다시 부른다.
          # 무한 루프를 막기 위해 호출 횟수에 상한을 둔다.
          MAX_CALLS=20
          CALL=1
          FAILURE_SEEN=0

          while [ "${CALL}" -le "${MAX_CALLS}" ]; do
            echo "--- 호출 ${CALL}/${MAX_CALLS}"

            HTTP_STATUS=$(curl --silent --show-error \
              --request POST \
              --header "x-cron-secret: ${CRON_SECRET}" \
              --max-time 120 \
              --output response.json \
              --write-out '%{http_code}' \
              "${APP_URL}/api/jobs/daily-settlement")

            cat response.json
            echo

            # 404 = 시크릿 불일치 또는 서버에 CRON_SECRET 미설정 (엔드포인트 존재를 숨긴다)
            if [ "${HTTP_STATUS}" != "200" ]; then
              echo "정산 호출 실패: HTTP ${HTTP_STATUS}"
              exit 1
            fi

            # 회원·블록 단위 실패는 배치를 멈추지 않는다. 다만 조용히 넘어가면 아무도 모른다.
            # 마지막 응답만 보면 중간 호출의 실패를 놓치므로 매 호출에서 확인해 둔다.
            # 빈 배열은 `[]` 이므로 "여는 대괄호 뒤에 ] 가 아닌 문자"가 있으면 내용이 있는 것이다.
            if grep -q '"failedMemberIds":\[[^]]' response.json; then
              FAILURE_SEEN=1
            fi
            if grep -q '"failedBlockIds":\[[^]]' response.json; then
              FAILURE_SEEN=1
            fi

            if ! grep -q '"hasMore":true' response.json; then
              echo "남은 대상 없음. 종료"
              break
            fi

            CALL=$((CALL + 1))
          done

          if [ "${FAILURE_SEEN}" = "1" ]; then
            echo "일부 회원·블록 정산 실패 — Vercel 로그 확인 필요"
            exit 1
          fi
